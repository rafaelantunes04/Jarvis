<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis - Chat</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/chat.css" />
</head>
<body class="app-layout">

<!-- SIDEBAR (injetada por sidebar.js) -->
<aside id="sidebar-mount"></aside>

<!-- MAIN -->
<main class="main">

  <div class="chat-header">
    <div class="dot"></div>
    <span class="title">Conversa</span>
    <span class="sub" id="header-user"></span>
  </div>

  <div id="messages">
    <div class="empty-state" id="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
      Começa uma conversa com o Jarvis
    </div>
  </div>

  <div id="input-bar">
    <textarea id="msg-input" placeholder="Escreve uma mensagem…" rows="1"></textarea>
    <button id="send-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

</main>

<script src="js/sidebar.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
