<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis - Login</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="page-login">

<div class="login-wrap">

  <div class="login-logo">
    <div class="icon brand-icon">
      <!-- bolt icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
    </div>
    <h1>Jarvis</h1>
    <p>Introduz as tuas credenciais para continuar</p>
  </div>

  <div class="login-card">

    <div id="error-banner" class="error-banner" style="margin-bottom:16px"></div>

    <div class="form-group">
      <label class="lbl" for="inp-user">Utilizador</label>
      <input
        id="inp-user"
        class="field"
        type="text"
        placeholder="username"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      />
    </div>

    <div class="form-group">
      <label class="lbl" for="inp-pass">Palavra-passe</label>
      <input
        id="inp-pass"
        class="field"
        type="password"
        placeholder="••••••••"
        autocomplete="new-password"
      />
    </div>

    <button class="btn-primary" id="login-btn">Entrar</button>

  </div>

  <p class="login-footer">Jarvis Desktop &mdash; v0.1.0</p>
</div>

<script src="js/login.js"></script>
</body>
</html>
